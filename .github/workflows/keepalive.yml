name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render services
        run: |
          curl -s -o /dev/null -w "torrents: %{http_code} (%{time_total}s)\n" "${{ vars.RENDER_URL }}/manifest.json" || true
          curl -s -o /dev/null -w "kkphim: %{http_code} (%{time_total}s)\n" "https://stremio-kkphim.onrender.com/manifest.json" || true
